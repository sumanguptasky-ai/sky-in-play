<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky in Play - Creative HTML & CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* आकाशीय बैकग्राउंड जो शाम से रात में बदलता हुआ महसूस हो */
        .sky-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* चमकते हुए तारे */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }

        /* तैरते हुए बादल (Moving Clouds) */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 100px;
            animation: floatClouds linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        /* बादल 1 */
        .c1 {
            width: 200px; height: 60px;
            top: 20%; left: -250px;
            animation-duration: 25s;
        }
        .c1::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .c1::after { width: 100px; height: 100px; top: -50px; left: 90px; }

        /* बादल 2 */
        .c2 {
            width: 300px; height: 80px;
            top: 50%; left: -350px;
            animation-duration: 35s;
            animation-delay: -10s;
        }
        .c2::before { width: 100px; height: 100px; top: -50px; left: 50px; }
        .c2::after { width: 120px; height: 120px; top: -70px; left: 140px; }

        @keyframes floatClouds {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(calc(100vw + 300px)); }
        }

        /* बीच का क्रिएटिव टेक्स्ट बॉक्स */
        .content-box {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #ffffff;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        .content-box h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-box p {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-bottom: 25px;
        }

        .explore-btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .explore-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="sky-container">
        <!-- तारे -->
        <div class="stars"></div>

        <!-- तैरते हुए बादल -->
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <!-- मुख्य कंटेंट -->
        <div class="content-box">
            <h1>Sky in Play</h1>
            <p>जहाँ बादलों का चलना और आसमान का जादू एक साथ महसूस होता है।</p>
            <a href="#" class="explore-btn"><a href="saccener.jpeg" > ><h3 style="color: red;"> Explore Sky/Deposite</h3></a>
        </div>
    </div>

</body>
</html>
